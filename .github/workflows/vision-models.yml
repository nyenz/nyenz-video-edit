# Makes the vision model files once and puts them on a release ("vision-model-1"), so the app (and setup) can download them:
# * transnetv2.onnx: TransNetV2 (Soucek & Lokoc, MIT licence), the neural shot-change finder: its published TensorFlow weights,
#   moved into the authors' PyTorch copy, exported to ONNX (100-frame window) and checked against TensorFlow on the same frames.
# * vittrack.onnx: VitTrack from the OpenCV model zoo (Apache 2.0), the neural object tracker used by cv2.TrackerVit.
# Run it by hand (Actions > Vision models > Run workflow). It only adds files; nothing in the app changes by running it.
name: Vision models

on:
  workflow_dispatch:
  push:                          # also when this file changes on main (so it can be started by a merge)
    branches: [main]
    paths: [".github/workflows/vision-models.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Tools
        run: |
          python -m pip install "tensorflow-cpu==2.15.*" "onnx==1.15.0" "onnxruntime==1.17.3" "numpy<2" "protobuf<4"
          python -m pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Download
        run: |
          B=https://media.githubusercontent.com/media/soCzech/TransNetV2/master/inference/transnetv2-weights
          mkdir -p tn/variables
          curl -fsSL -o tn/saved_model.pb "$B/saved_model.pb"
          curl -fsSL -o tn/variables/variables.data-00000-of-00001 "$B/variables/variables.data-00000-of-00001"
          curl -fsSL -o tn/variables/variables.index "$B/variables/variables.index"
          curl -fsSL -o vittrack.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/object_tracking_vittrack/object_tracking_vittrack_2023sep.onnx
          git clone -q --depth 1 https://github.com/soCzech/TransNetV2.git src
          ls -la tn tn/variables vittrack.onnx src/inference-pytorch
      # The TensorFlow graph cannot be turned into ONNX directly (its colour histogram uses a 2-D segment sum that ONNX lacks), so
      # the authors' own PyTorch copy of the network is filled with the TensorFlow weights (their convert_weights.py) and that is
      # exported. The histogram is rewritten with plain maths (same numbers), and the window is fixed at 100 frames, as the app uses it.
      - name: Convert to ONNX
        working-directory: src/inference-pytorch
        run: |
          python - <<'PY'
          import numpy as np, tensorflow as tf, torch, torch.nn.functional as F
          import transnetv2_pytorch as T
          from convert_weights import convert_weights

          def hist(frames):                              # frames: float 0..255, [B, T, 27, 48, 3]
              f = torch.floor(frames / 32.0)
              b = f[..., 0] * 64 + f[..., 1] * 8 + f[..., 2]
              n = frames.shape[0] * frames.shape[1]
              b = b.reshape(n, -1).long() + (torch.arange(n) * 512).view(-1, 1)
              h = torch.zeros(n * 512).scatter_add(0, b.reshape(-1), torch.ones(b.numel()))
              return F.normalize(h.view(frames.shape[0], frames.shape[1], 512), p=2, dim=2)
          T.ColorHistograms.compute_color_histograms = staticmethod(hist)

          # The same maths, but quicker on a normal computer: the (2+1)D convolutions are written as 2-D convolutions (which
          # onnxruntime runs much faster than 3-D ones), and the four spatial convolutions of a block, which all read the same
          # input, become one.
          def block(self, x):
              n, c, t, h, w = x.shape
              convs = [self.Conv3D_1, self.Conv3D_2, self.Conv3D_4, self.Conv3D_8]
              ws = torch.cat([k.layers[0].weight[:, :, 0] for k in convs])
              y = F.conv2d(x.permute(0, 2, 1, 3, 4).reshape(n * t, c, h, w), ws, padding=1)
              y = y.reshape(n, t, -1, h, w).permute(0, 2, 1, 3, 4).reshape(n, -1, t, h * w)
              outs, at = [], 0
              for k in convs:
                  l = k.layers[1]
                  d, f2 = l.dilation[0], l.in_channels
                  outs.append(F.conv2d(y[:, at:at + f2], l.weight[..., 0], l.bias, padding=(d, 0), dilation=(d, 1)))
                  at += f2
              x = torch.cat(outs, 1).reshape(n, -1, t, h, w)
              if self.bn is not None:
                  x = self.bn(x)
              if self.activation is not None:
                  x = self.activation(x)
              return x
          T.DilatedDCNNV2.forward = block

          tm, tfm = convert_weights("../../tn")
          tm.eval()

          class Run(torch.nn.Module):
              def __init__(self, m):
                  super().__init__()
                  self.m = m
              def forward(self, frames):
                  m = self.m
                  x = frames.permute(0, 4, 1, 2, 3) / 255.0
                  feats = []
                  for block in m.SDDCNN:
                      x = block(x)
                      feats.append(x)
                  if m.use_mean_pooling:
                      x = torch.mean(x, dim=[3, 4]).permute(0, 2, 1)
                  else:
                      x = x.permute(0, 2, 3, 4, 1)
                      x = x.reshape(x.shape[0], x.shape[1], -1)
                  x = torch.cat([m.frame_sim_layer(feats), x], 2)
                  x = torch.cat([m.color_hist_layer(frames), x], 2)
                  x = F.relu(m.fc1(x))
                  return torch.sigmoid(m.cls_layer1(x)), torch.sigmoid(m.cls_layer2(x))

          net = Run(tm).eval()
          rng = np.random.default_rng(1)
          tests = []
          for k in range(4):
              x = rng.integers(0, 256, (1, 100, 27, 48, 3)).astype(np.float32)
              if k:                                      # a hard change, and plain colour blocks, as real video has
                  x[:, 30 * k:] = rng.integers(0, 256, (1, 1, 1, 1, 3)).astype(np.float32)
              tests.append(x)
          with torch.no_grad():
              torch.onnx.export(net, torch.from_numpy(tests[0]), "../../transnetv2.onnx", input_names=["frames"],
                                output_names=["single", "many"], opset_version=17)
          import onnxruntime as ort
          s = ort.InferenceSession("../../transnetv2.onnx", providers=["CPUExecutionProvider"])
          worst = 0.0
          for x in tests:
              ts, tmn = tfm(tf.constant(x))
              want = [tf.sigmoid(ts).numpy(), tf.sigmoid(tmn["many_hot"]).numpy()]
              got = s.run(None, {"frames": x})
              for g, w in zip(got, want):
                  d = float(np.abs(g.reshape(-1) - w.reshape(-1)).max())
                  worst = max(worst, d)
                  print(g.shape, w.shape, "biggest difference", d)
          assert worst < 5e-3, worst
          print("same as TensorFlow: ok", worst)
          import time
          s.run(None, {"frames": tests[0]})
          t0 = time.time()
          for _ in range(5):
              s.run(None, {"frames": tests[0]})
          print("seconds per 100 frames:", (time.time() - t0) / 5)
          PY
          cd ../..
          ls -la transnetv2.onnx
          sha256sum transnetv2.onnx vittrack.onnx
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vision-model-1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create vision-model-1 -R "$GITHUB_REPOSITORY" --title "Vision models 1" \
              --notes "Model files the app downloads once: TransNetV2 (shot changes, MIT) and VitTrack (object tracking, Apache 2.0)." --prerelease
          gh release upload vision-model-1 -R "$GITHUB_REPOSITORY" transnetv2.onnx vittrack.onnx --clobber
